<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>转盘小助手</title>
  <style>
    html {
      font-size: calc(min(100vw, 540px) / 7.5);
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Segoe UI, Arial, Roboto, 'PingFang SC', sans-serif;
      background-color: #f7f8fa;
      -webkit-tap-highlight-color: transparent;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      background: #e0e0e0;
    }
    
    #app {
      width: 100%;
      max-width: 540px;
      height: 100%;
      background-color: #f7f8fa;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      position: relative;
    }
    
    .page-layer {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      background: #f7f8fa;
      z-index: 100;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .page-layer.active { display: flex; }

    /* ================= HOME PAGE ================= */
    .home-header { padding: 0.4rem 0.3rem; }
    .home-title { font-size: 0.48rem; font-weight: bold; color: #333; display: block; margin-bottom: 0.1rem; }
    .home-subtitle { font-size: 0.28rem; color: #999; }
    
    .home-list { flex: 1; padding: 0 0.3rem; overflow-y: auto; }
    .list-item { background: #fff; border-radius: 0.2rem; padding: 0.3rem; margin-bottom: 0.3rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0.04rem 0.12rem rgba(0,0,0,0.05); cursor: pointer; }
    .item-content { flex: 1; }
    .item-name { font-size: 0.34rem; font-weight: bold; color: #333; margin-bottom: 0.1rem; }
    .item-desc { font-size: 0.26rem; color: #888; }
    .item-actions { display: flex; gap: 0.2rem; }
    .action-btn { font-size: 0.26rem; padding: 0.1rem 0.2rem; border-radius: 0.1rem; color: #fff; border: none; cursor: pointer; }
    .edit-btn { background-color: #4CAF50; }
    .delete-btn { background-color: #FF5252; }

    .bottom-area { padding: 0.3rem; background: #f7f8fa; position: sticky; bottom: 0; }
    .btn-create { background-color: #FF8C00; color: #fff; font-size: 0.34rem; border-radius: 0.5rem; width: 100%; height: 0.9rem; display: flex; align-items: center; justify-content: center; border: none; box-shadow: 0 0.06rem 0.2rem rgba(255, 140, 0, 0.4); cursor: pointer; font-weight: bold; }

    /* ================= PLAY PAGE ================= */
    .header-bar { padding: 0.3rem; display: flex; align-items: center; background: #fff; position: sticky; top: 0; z-index: 10; box-shadow: 0 0.02rem 0.1rem rgba(0,0,0,0.05); flex-shrink: 0; }
    .btn-back { font-size: 0.32rem; color: #666; margin-right: 0.3rem; cursor: pointer; }
    .header-title { font-size: 0.36rem; font-weight: bold; color: #333; flex: 1; text-align: center; margin-right: 0.6rem; }
    
    .roulette-container { margin: 1rem auto 0 auto; position: relative; width: 6rem; height: 6rem; }
    .roulette-bg { width: 100%; height: 100%; border-radius: 50%; background-color: #fff; box-shadow: 0 0.1rem 0.3rem rgba(0, 0, 0, 0.1); position: relative; overflow: hidden; border: 0.1rem solid #fff; box-sizing: border-box; }
    .roulette-wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; }
    
    .wheel-line { position: absolute; top: 0; left: 50%; width: 0.04rem; height: 50%; background-color: #fff; transform-origin: 50% 100%; margin-left: -0.02rem; z-index: 2; }
    .wheel-text-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 3; }
    .wheel-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
    .text-content { position: absolute; top: 0.3rem; left: 50%; transform: translateX(-50%); text-align: center; font-size: 0.36rem; font-weight: bold; color: #fff; width: 1.4rem; line-height: 1.4; word-break: break-all; text-shadow: 0 0.04rem 0.08rem rgba(0,0,0,0.5), 0 0.02rem 0.04rem rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: flex-start; align-items: center; }

    .roulette-pointer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); width: 0; height: 0; border-left: 0.2rem solid transparent; border-right: 0.2rem solid transparent; border-bottom: 0.6rem solid #FF4500; z-index: 10; margin-top: -0.3rem; }
    .roulette-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1.2rem; height: 1.2rem; background-color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0.04rem 0.1rem rgba(0,0,0,0.2); z-index: 11; font-size: 0.32rem; font-weight: bold; color: #FF4500; cursor: pointer; }

    /* ================= EDIT PAGE ================= */
    .edit-group { background: #fff; padding: 0.3rem; border-radius: 0.2rem; margin: 0.3rem; }
    .edit-label { font-size: 0.3rem; font-weight: bold; margin-bottom: 0.2rem; color: #333; }
    .edit-input { width: 100%; font-size: 0.28rem; padding: 0.2rem; background: #f5f5f5; border: none; border-radius: 0.1rem; box-sizing: border-box; outline: none; }
    .edit-item-row { display: flex; align-items: center; padding: 0.2rem 0; border-bottom: 1px solid #eee; }
    .edit-item-row:last-child { border-bottom: none; }
    .edit-color-picker { width: 0.5rem; height: 0.5rem; border-radius: 50%; margin-right: 0.2rem; border: 0.04rem solid #ddd; cursor: pointer; flex-shrink: 0; }
    .edit-item-input { flex: 1; font-size: 0.28rem; padding: 0.1rem; border: none; background: transparent; outline: none; }
    .btn-del-item { width: 0.5rem; height: 0.5rem; line-height: 0.46rem; text-align: center; border-radius: 50%; background: #FFE4E1; color: #FF4500; font-size: 0.4rem; margin-left: 0.2rem; cursor: pointer; flex-shrink: 0; border: none; padding: 0; }
    .btn-add-item { margin: 0 0.3rem; background: #fff; color: #FF8C00; border: 2px dashed #FF8C00; border-radius: 0.2rem; font-size: 0.3rem; padding: 0.2rem 0; cursor: pointer; width: calc(100% - 0.6rem); }
    .btn-save { background: #FF8C00; color: #fff; border-radius: 0.5rem; font-size: 0.32rem; padding: 0.2rem 0; width: 90%; margin: 0.4rem auto; border: none; box-shadow: 0 0.08rem 0.2rem rgba(255,140,0,0.3); cursor: pointer; display: block; flex-shrink: 0; }

    /* ================= MODALS ================= */
    .mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: none; align-items: center; justify-content: center; }
    .mask.show { display: flex; }
    .dialog { width: 80%; background: #fff; border-radius: 0.2rem; padding: 0.4rem; box-sizing: border-box; text-align: center; }
    .dialog-title { font-size: 0.36rem; font-weight: bold; margin-bottom: 0.4rem; }
    .dialog-content { font-size: 0.4rem; font-weight: bold; margin-bottom: 0.6rem; }
    .btn-close { background: #FF8C00; color: #fff; border-radius: 0.4rem; width: 80%; padding: 0.2rem 0; border: none; font-size: 0.32rem; cursor: pointer; }

    .control-panel { width: 80%; background: #fff; border-radius: 0.2rem; padding: 0.4rem; box-sizing: border-box; }
    .panel-title { text-align: center; font-size: 0.32rem; font-weight: bold; margin-bottom: 0.3rem; }
    .panel-mode { display: flex; align-items: center; font-size: 0.28rem; margin-bottom: 0.2rem; justify-content: center; }
    .panel-mode label { margin-left: 0.2rem; cursor: pointer; display: flex; align-items: center; }
    .panel-queue { font-size: 0.26rem; color: #666; margin-bottom: 0.2rem; padding: 0.1rem; background: #f5f5f5; border-radius: 0.1rem; max-height: 1.2rem; overflow-y: auto; text-align: left; }
    .queue-item { color: #FF4500; font-weight: bold; }
    .panel-list { max-height: 4rem; overflow-y: auto; }
    .panel-item-row { display: flex; align-items: center; justify-content: space-between; padding: 0.15rem 0; border-bottom: 1px solid #eee; }
    .item-name { flex: 1; font-size: 0.28rem; text-align: left; color: #333; cursor: pointer; }
    .add-tip { font-size: 0.22rem; color: #999; margin-left: 0.1rem; }
    .item-weight { display: flex; align-items: center; font-size: 0.26rem; color: #666; }
    .weight-input { width: 0.6rem; height: 0.4rem; border: 1px solid #ccc; border-radius: 0.06rem; text-align: center; margin-left: 0.1rem; font-size: 0.26rem; outline: none; }
    .panel-actions { display: flex; margin-top: 0.3rem; justify-content: space-between; }
    .panel-actions button { width: 30%; font-size: 0.28rem; padding: 0.15rem 0; border: none; border-radius: 0.1rem; cursor: pointer; }
    .btn-clear { background: #FFE4E1; color: #FF4500; }
    .btn-cancel { background: #eee; color: #333; }
    .btn-confirm { background: #FF4500; color: #fff; }
  </style>
</head>
<body>

<div id="app">
  <!-- ================= HOME PAGE ================= -->
  <div id="home-page" class="page-layer active">
    <div class="home-header">
      <span class="home-title">我的转盘</span>
      <span class="home-subtitle">选择一个转盘开始，或创建专属转盘</span>
    </div>
    <div class="home-list" id="home-list">
      <!-- 动态渲染列表 -->
    </div>
    <div class="bottom-area">
      <button class="btn-create" onclick="goToEdit()">+ 创建新转盘</button>
    </div>
  </div>

  <!-- ================= PLAY PAGE ================= -->
  <div id="play-page" class="page-layer">
    <div class="header-bar">
      <div class="btn-back" onclick="closePlay()">&lt; 返回</div>
      <div class="header-title" id="play-title">加载中...</div>
    </div>
    <div class="roulette-container">
      <div class="roulette-bg">
        <div id="wheel" class="roulette-wheel">
          <div id="wheel-lines"></div>
          <div id="wheel-texts" class="wheel-text-container"></div>
        </div>
        <div class="roulette-pointer"></div>
        <div class="roulette-btn" onclick="onCenterClick()">
          <span>开始</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= EDIT PAGE ================= -->
  <div id="edit-page" class="page-layer">
    <div class="header-bar">
      <div class="btn-back" onclick="closeEdit()">&lt; 返回</div>
      <div class="header-title" id="edit-title">编辑转盘</div>
    </div>
    <div class="edit-group">
      <div class="edit-label">转盘名称</div>
      <input id="edit-name-input" class="edit-input" placeholder="请输入转盘名称" oninput="onEditNameInput(event)" />
    </div>
    <div class="edit-label" id="edit-items-count" style="padding-left: 0.4rem;">转盘选项</div>
    <div class="edit-group" id="edit-items-container" style="margin-top: 0;">
      <!-- 动态渲染选项输入 -->
    </div>
    <button class="btn-add-item" onclick="addEditItem()">+ 添加选项</button>
    <button class="btn-save" onclick="saveRoulette()">保存</button>
  </div>

  <!-- ================= MODALS ================= -->
  <div id="result-mask" class="mask">
    <div class="dialog">
      <div id="result-title" class="dialog-title">🎯 抽取结果</div>
      <div id="result-content" class="dialog-content"></div>
      <button class="btn-close" onclick="closeResult()">确定</button>
    </div>
  </div>

  <div id="control-mask" class="mask">
    <div class="control-panel">
      <div class="panel-title">设定结果序列与权重（仅家长可见）</div>
      <div class="panel-mode">
        默认抽取：
        <label><input type="radio" name="fallbackMode" value="random" onchange="onModeChange(this.value)"> 纯随机</label>
        <label><input type="radio" name="fallbackMode" value="weight" onchange="onModeChange(this.value)"> 按权重</label>
      </div>
      <div class="panel-queue" id="panel-queue">当前序列：<span style="color: #999">空</span></div>
      <div id="control-list" class="panel-list"></div>
      <div class="panel-actions">
        <button class="btn-clear" onclick="clearTarget()">清空</button>
        <button class="btn-cancel" onclick="closeControlPanel()">取消</button>
        <button class="btn-confirm" onclick="confirmControlTarget()">确定</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 数据初始化
  function getRoulettes() {
    let data = localStorage.getItem('roulettes');
    if (!data) {
      data = [
        {
          id: '1', name: '儿童日常行为奖励', isDefault: true, fallbackMode: 'random',
          items: [
            { text: '多看20分钟绘本', color: '#FF7F50', weight: 1 },
            { text: '免一次家务', color: '#6495ED', weight: 1 },
            { text: '获得小贴纸', color: '#FFB6C1', weight: 1 },
            { text: '看一集动画片', color: '#32CD32', weight: 1 },
            { text: '吃一个小零食', color: '#FFA500', weight: 1 },
            { text: '去公园玩一次', color: '#9370DB', weight: 1 }
          ]
        },
        {
          id: '2', name: '儿童日常行为惩罚', isDefault: true, fallbackMode: 'random',
          items: [
            { text: '收拾玩具', color: '#4682B4', weight: 1 },
            { text: '背诵一首古诗', color: '#D2B48C', weight: 1 },
            { text: '禁止看电视30分钟', color: '#778899', weight: 1 },
            { text: '罚站5分钟', color: '#5F9EA0', weight: 1 },
            { text: '写一篇日记', color: '#BC8F8F', weight: 1 },
            { text: '没收电子产品一天', color: '#708090', weight: 1 }
          ]
        }
      ];
      localStorage.setItem('roulettes', JSON.stringify(data));
    } else {
      data = JSON.parse(data);
    }
    return data;
  }
  function saveRoulettes(data) { localStorage.setItem('roulettes', JSON.stringify(data)); }

  // 页面切换
  function showPage(pageId) {
    document.querySelectorAll('.page-layer').forEach(el => el.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
  }

  // ================= HOME PAGE LOGIC =================
  function renderHomeList() {
    const list = getRoulettes();
    const container = document.getElementById('home-list');
    container.innerHTML = '';
    list.forEach(r => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'list-item';
      itemDiv.onclick = () => goToPlay(r.id);
      
      const content = document.createElement('div');
      content.className = 'item-content';
      content.innerHTML = `<div class="item-name">${r.name}</div><div class="item-desc">包含 ${r.items.length} 个选项</div>`;
      
      const actions = document.createElement('div');
      actions.className = 'item-actions';
      
      const editBtn = document.createElement('button');
      editBtn.className = 'action-btn edit-btn';
      editBtn.innerText = '编辑';
      editBtn.onclick = (e) => { e.stopPropagation(); goToEdit(r.id); };
      actions.appendChild(editBtn);
      
      if (!r.isDefault) {
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn delete-btn';
        delBtn.innerText = '删除';
        delBtn.onclick = (e) => { e.stopPropagation(); deleteRoulette(r.id); };
        actions.appendChild(delBtn);
      }
      
      itemDiv.appendChild(content);
      itemDiv.appendChild(actions);
      container.appendChild(itemDiv);
    });
  }

  function deleteRoulette(id) {
    if(confirm('确定要删除这个转盘吗？')) {
      let list = getRoulettes();
      list = list.filter(r => r.id !== id);
      saveRoulettes(list);
      renderHomeList();
    }
  }

  // ================= PLAY PAGE LOGIC =================
  let currentPlayId = null;
  let currentRoulette = null;
  let isSpinning = false;
  let rotateAngle = 0;
  
  // 隐藏控制
  let clickCount = 0;
  let lastClickTime = 0;
  let spinTimer = null;
  let resultTimeout = null;
  let controlCooling = false;
  let targetQueue = [];
  let tempTargetQueue = [];
  let tempFallbackMode = 'random';
  let tempWeights = [];

  function goToPlay(id) {
    currentPlayId = id;
    const list = getRoulettes();
    currentRoulette = list.find(r => r.id === id);
    if (!currentRoulette) return;
    
    document.getElementById('play-title').innerText = currentRoulette.name;
    targetQueue = [];
    rotateAngle = 0;
    document.getElementById('wheel').style.transform = `rotate(0deg)`;
    document.getElementById('wheel').style.transition = 'none';
    
    renderWheel();
    showPage('play-page');
  }

  function closePlay() { showPage('home-page'); renderHomeList(); }

  function renderWheel() {
    const items = currentRoulette.items;
    const total = items.length;
    let gradientStr = 'conic-gradient(';
    let linesHtml = '';
    let textsHtml = '';

    items.forEach((item, index) => {
      const startDeg = (index * 360) / total;
      const endDeg = ((index + 1) * 360) / total;
      gradientStr += `${item.color} ${startDeg}deg ${endDeg}deg`;
      if (index < total - 1) gradientStr += ', ';

      linesHtml += `<div class="wheel-line" style="transform: rotate(${startDeg}deg);"></div>`;
      textsHtml += `<div class="wheel-text" style="transform: rotate(${startDeg + 180/total}deg);"><span class="text-content">${item.text}</span></div>`;
    });
    gradientStr += ')';

    const wheel = document.getElementById('wheel');
    wheel.style.background = gradientStr;
    document.getElementById('wheel-lines').innerHTML = linesHtml;
    document.getElementById('wheel-texts').innerHTML = textsHtml;
  }

  function onCenterClick() {
    const now = Date.now();
    
    if (!controlCooling) {
      if (now - lastClickTime <= 500) clickCount++;
      else clickCount = 1;
      lastClickTime = now;

      if (clickCount >= 5) {
        clickCount = 0;
        if (spinTimer) clearTimeout(spinTimer);
        if (resultTimeout) clearTimeout(resultTimeout);
        isSpinning = false;
        document.getElementById('wheel').style.transition = 'none';
        showHiddenControl();
        return;
      }
    }

    if (isSpinning) return;
    if (window.lastSpinTime && (now - window.lastSpinTime < 800)) return;
    window.lastSpinTime = now;

    spinTimer = setTimeout(() => {
      if (clickCount < 2) startSpin();
    }, 200);
  }

  function showHiddenControl() {
    tempFallbackMode = currentRoulette.fallbackMode || 'random';
    tempWeights = currentRoulette.items.map(item => item.weight !== undefined ? item.weight : 1);
    tempTargetQueue = [...targetQueue];
    
    document.querySelector(`input[name="fallbackMode"][value="${tempFallbackMode}"]`).checked = true;
    renderControlList();
    renderQueue();
    document.getElementById('control-mask').classList.add('show');
    
    controlCooling = true;
    setTimeout(() => { controlCooling = false; }, 2000);
  }

  function onModeChange(val) {
    tempFallbackMode = val;
    renderControlList();
  }

  function renderControlList() {
    let html = '';
    currentRoulette.items.forEach((item, i) => {
      html += `
        <div class="panel-item-row">
          <div class="item-name" onclick="selectTarget(${i})">${item.text} <span class="add-tip">(点我加入序列)</span></div>
          ${tempFallbackMode === 'weight' ? `
          <div class="item-weight">权重: <input type="number" class="weight-input" value="${tempWeights[i]}" oninput="onWeightInput(event, ${i})"></div>
          ` : ''}
        </div>
      `;
    });
    document.getElementById('control-list').innerHTML = html;
  }

  function renderQueue() {
    const qDiv = document.getElementById('panel-queue');
    if (tempTargetQueue.length === 0) {
      qDiv.innerHTML = '当前序列：<span style="color: #999">空</span>';
    } else {
      let html = '当前序列：';
      tempTargetQueue.forEach((idx, i) => {
        html += `<span class="queue-item">${currentRoulette.items[idx].text}</span>`;
        if (i < tempTargetQueue.length - 1) html += ' ➔ ';
      });
      qDiv.innerHTML = html;
    }
  }

  function selectTarget(index) {
    tempTargetQueue.push(index);
    renderQueue();
  }
  function clearTarget() {
    tempTargetQueue = [];
    renderQueue();
  }
  function onWeightInput(e, index) {
    let val = parseInt(e.target.value);
    if (isNaN(val) || val < 0) val = 0;
    tempWeights[index] = val;
  }
  function closeControlPanel() { document.getElementById('control-mask').classList.remove('show'); }

  function confirmControlTarget() {
    currentRoulette.fallbackMode = tempFallbackMode;
    currentRoulette.items.forEach((item, i) => { item.weight = tempWeights[i]; });
    
    let list = getRoulettes();
    let idx = list.findIndex(r => r.id === currentRoulette.id);
    if(idx > -1) {
      list[idx] = currentRoulette;
      saveRoulettes(list);
    }

    targetQueue = [...tempTargetQueue];
    closeControlPanel();
    alert(targetQueue.length > 0 ? `已设定接下来的 ${targetQueue.length} 次结果` : `已应用${tempFallbackMode === 'weight' ? '权重' : '随机'}模式`);
  }

  function startSpin() {
    if (isSpinning) return;
    const itemsCount = currentRoulette.items.length;
    if (itemsCount === 0) return;

    isSpinning = true;
    let winIndex = -1;

    if (targetQueue.length > 0) {
      winIndex = targetQueue.shift();
    } else {
      if (currentRoulette.fallbackMode === 'weight') {
        let totalWeight = currentRoulette.items.reduce((sum, item) => sum + (parseInt(item.weight) || 0), 0);
        if (totalWeight > 0) {
          let random = Math.floor(Math.random() * totalWeight);
          for (let i = 0; i < itemsCount; i++) {
            let w = parseInt(currentRoulette.items[i].weight) || 0;
            if (random < w) { winIndex = i; break; }
            random -= w;
          }
        } else { winIndex = Math.floor(Math.random() * itemsCount); }
      } else {
        winIndex = Math.floor(Math.random() * itemsCount);
      }
    }

    const sectorAngle = 360 / itemsCount;
    const itemCenterAngle = (winIndex * sectorAngle) + (sectorAngle / 2);
    const baseRotations = 5 * 360;
    const currentBaseAngle = Math.floor(rotateAngle / 360) * 360;
    const finalAngle = currentBaseAngle + baseRotations + (360 - itemCenterAngle);

    rotateAngle = finalAngle;
    const wheel = document.getElementById('wheel');
    wheel.style.transition = 'transform 3000ms cubic-bezier(0.25, 0.1, 0.25, 1)';
    wheel.style.transform = `rotate(${rotateAngle}deg)`;

    resultTimeout = setTimeout(() => {
      isSpinning = false;
      document.getElementById('result-content').innerText = currentRoulette.items[winIndex].text;
      document.getElementById('result-content').style.color = currentRoulette.items[winIndex].color;
      document.getElementById('result-mask').classList.add('show');
      if (navigator.vibrate) navigator.vibrate(50);
    }, 3000);
  }

  function closeResult() { document.getElementById('result-mask').classList.remove('show'); }

  // ================= EDIT PAGE LOGIC =================
  let editData = null;
  const colorList = ['#FF7F50', '#6495ED', '#FFB6C1', '#32CD32', '#FFA500', '#9370DB', '#4682B4', '#D2B48C', '#778899', '#5F9EA0', '#BC8F8F', '#708090'];

  function goToEdit(id = null) {
    if (id) {
      editData = JSON.parse(JSON.stringify(getRoulettes().find(r => r.id === id)));
      document.getElementById('edit-title').innerText = '编辑转盘';
    } else {
      editData = {
        id: Date.now().toString(),
        name: '',
        isDefault: false,
        fallbackMode: 'random',
        items: [
          { text: '选项1', color: colorList[0], weight: 1 },
          { text: '选项2', color: colorList[1], weight: 1 }
        ]
      };
      document.getElementById('edit-title').innerText = '新增转盘';
    }
    
    document.getElementById('edit-name-input').value = editData.name;
    document.getElementById('edit-name-input').disabled = editData.isDefault;
    renderEditItems();
    showPage('edit-page');
  }

  function closeEdit() { showPage('home-page'); renderHomeList(); }

  function onEditNameInput(e) { editData.name = e.target.value; }

  function renderEditItems() {
    document.getElementById('edit-items-count').innerText = `转盘选项 (${editData.items.length}/12)`;
    let html = '';
    editData.items.forEach((item, index) => {
      html += `
        <div class="edit-item-row">
          <div class="edit-color-picker" style="background-color: ${item.color};" onclick="changeColor(${index})"></div>
          <input class="edit-item-input" value="${item.text}" oninput="onItemTextInput(event, ${index})" placeholder="请输入选项内容" />
          <button class="btn-del-item" onclick="deleteEditItem(${index})">×</button>
        </div>
      `;
    });
    document.getElementById('edit-items-container').innerHTML = html;
  }

  function changeColor(index) {
    const item = editData.items[index];
    let colorIdx = colorList.indexOf(item.color);
    colorIdx = (colorIdx + 1) % colorList.length;
    item.color = colorList[colorIdx];
    renderEditItems();
  }

  function onItemTextInput(e, index) { editData.items[index].text = e.target.value; }

  function addEditItem() {
    if (editData.items.length >= 12) { alert('最多只能添加 12 个选项'); return; }
    editData.items.push({ text: '', color: colorList[editData.items.length % colorList.length], weight: 1 });
    renderEditItems();
  }

  function deleteEditItem(index) {
    if (editData.items.length <= 2) { alert('最少需要保留 2 个选项'); return; }
    editData.items.splice(index, 1);
    renderEditItems();
  }

  function saveRoulette() {
    if (!editData.name.trim()) { alert('请输入转盘名称'); return; }
    for (let item of editData.items) {
      if (!item.text.trim()) { alert('所有选项内容都不能为空'); return; }
    }
    
    let list = getRoulettes();
    const idx = list.findIndex(r => r.id === editData.id);
    if (idx > -1) list[idx] = editData;
    else list.push(editData);
    
    saveRoulettes(list);
    alert('保存成功！');
    closeEdit();
  }

  // 初始化
  renderHomeList();
</script>
</body>
</html>
